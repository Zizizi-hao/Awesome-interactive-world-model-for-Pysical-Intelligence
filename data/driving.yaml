  - title: 'SafeDriveVLA: Navigation-Conditioned World Model Dreaming for Conflict-Aware End-to-End Autonomous Driving'
    short: SafeDriveVLA
    org: UC Irvine / UC San Diego / University of Cincinnati / National University of Singapore
    year: 2026
    venue: CoRL
    category: driving
    links:
      arxiv: '2610.20609'
      project: https://asguard-uci.github.io/SafeDriveVLA/
