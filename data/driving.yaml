    features: {action: true, closedloop: true}
    tags: [轨迹条件JEPA, 结果监督, 候选打分, NAVSIM]
    note: 打分器是轨迹条件的 JEPA：每条候选轨迹预测一个状态，分数从该状态读出。仿真给所有候选标结果，真实日志里的未来只在训练时锚定已执行的那一条。全部 12,146 个 NAVSIM 测试场景上，v2 为 93.0 EPDMS，v1 为 94.0 PDMS。去掉惯性重排后是 91.4 EPDMS，同一评测下 DrivoR 为 90.7。把候选状态随机对调，PDMS 从 94.19 降到 79.73。Bench2Drive 上改过输入的系统为 73.27 Driving Score、成功率 46.36%，对照方法的训练数据和接口并不对齐。LeWM 和规划预算固定时，OGBench-Cube 成功率从 68.91% 到 73.64%。
    note_en: "The scorer is a trajectory-conditioned JEPA: it predicts a state for each candidate trajectory and reads the score from that state. Simulation labels outcomes for all candidates, while the future from real logs anchors only the executed trajectory during training. Across all 12,146 NAVSIM test scenarios, it achieves 93.0 EPDMS on v2 and 94.0 PDMS on v1. Without inertia reranking, it achieves 91.4 EPDMS, compared with 90.7 for DrivoR under the same evaluation. Randomly swapping candidate states reduces PDMS from 94.19 to 79.73. On Bench2Drive, the system with modified inputs achieves a 73.27 Driving Score and a 46.36% success rate; the compared methods' training data and interfaces are not aligned. With LeWM and the planning budget fixed, OGBench-Cube success rate increases from 68.91% to 73.64%."

