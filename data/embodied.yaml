  - title: "RoboPhys-3D: A Comprehensive Embodied World Model Evaluation via 3D Reconstruction"
    short: RoboPhys-3D
    org: "Christian Claudel 团队"
    org_en: "Christian Claudel team"
    year: 2026
    venue: arXiv
    category: embodied
    links:
      arxiv: "2608.28718"
    features: {}
    tags: [具身世界模型基准, 3D重建评测, 操作任务, 执行感知评价]
    note: 基于 RoboTwin 2.0 的 3D 接地具身世界模型基准，覆盖 4 类场景 50 个操作任务、5,000 集与 25,000 段多视角真值视频；生成视频与真值视频走同一 3D 重建管线，从而区分重建误差与生成误差。50 项指标组织为像素保真、3D 几何一致性、状态理解、任务完成 4 层 18 个子维度，并提出 Average Full Score 及与任务成功强相关的 RoboPhyscore（与人类评价 Pearson r=0.9761）；评测 Cosmos 3 等代表性模型发现感知/ VLM 式评判会遗漏大量状态与执行层面的失败。
    note_en: "A 3D-grounded embodied world-model benchmark built on RoboTwin 2.0, covering 50 manipulation tasks in 4 scene categories, 5,000 episodes, and 25,000 multi-view ground-truth videos. Generated and ground-truth videos pass through the same 3D reconstruction pipeline to separate reconstruction errors from generation errors. Its 50 metrics are organized into 4 levels and 18 subdimensions: pixel fidelity, 3D geometric consistency, state understanding, and task completion. It introduces Average Full Score and RoboPhyscore, which correlates strongly with task success and human evaluation (Pearson r=0.9761). Evaluations of representative models including Cosmos 3 find that perceptual or VLM-based judgments miss many state-level and execution-level failures."

  - title: "Hydra: A Navigation World Action Model with Discrete Latent Planning and Continuous Flow-Matching Execution"
    short: Hydra
    org: "Xuesu Xiao 团队"
    org_en: "Xuesu Xiao team"
    year: 2026
    venue: arXiv
    category: embodied
    links:
      arxiv: "2608.28995"
    features: {action: true, realtime: true, closedloop: true}
    tags: [离散潜空间规划, 向量量化, 流匹配, 导航控制, 世界动作模型]
    note: 针对生成模型与规划器流形脱节、候选动作须解码回像素才能评估的实时控制瓶颈，Hydra 在视觉状态、物理位姿与控制动作上建立统一潜流形，用模态专属 VQ 瓶颈压缩为运动学意图与视觉状态的离散词表，使规划器（采样与评估）原生工作在离散空间——以运动学-感知代价排序候选、全程不解码像素（Discrete Latent Planning），再用条件流匹配把离散意图映射为连续轨迹执行；在两台真实机器人上目标导向规划超越 SOTA 世界模型，闭环执行持平或超过领先反应式基础策略。
    note_en: "Addresses the real-time control bottleneck caused by mismatched generative-model and planner manifolds, where candidate actions must be decoded into pixels for evaluation. Hydra builds a unified latent manifold over visual states, physical poses, and control actions, using modality-specific VQ bottlenecks to compress them into discrete vocabularies of kinematic intentions and visual states. The planner samples and evaluates natively in discrete space, ranking candidates with a kinematic-perceptual cost without decoding pixels throughout (Discrete Latent Planning). Conditional flow matching then maps discrete intentions to continuous trajectories for execution. On two real robots, goal-directed planning outperforms SOTA world models, while closed-loop execution matches or exceeds leading reactive foundation policies."

