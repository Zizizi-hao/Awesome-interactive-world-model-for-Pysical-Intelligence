    note: 以状态–动作历史估计隐含动力学，并结合动作条件状态预测误差与潜参数偏移检测异常；240 条真机起重机轨迹、10 种子评测中，高噪相机状态估计下 AP 为 0.77，RWM 为 0.61。需正常运行参考分布，工况变化可能误报，尚无闭环干预验证。
    note_en: Infers latent dynamics from state–action history and detects anomalies using action-conditioned prediction errors and latent deviations. Across 240 real crane trajectories and 10 seeds, AP with noisy camera-based state estimates is 0.77 versus RWM's 0.61. A nominal reference distribution is required; operating-condition changes may trigger false alarms, and closed-loop intervention is untested.
