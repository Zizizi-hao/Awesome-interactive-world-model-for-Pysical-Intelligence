  - title: "GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation"
    short: GaussianDream++
    org: "Haibao Yu 团队"
    org_en: "Haibao Yu team"
    year: 2026
    venue: arXiv
    category: embodied
    links:
      arxiv: "2608.25659"
    features: {action: true, closedloop: true}
    tags: [3D高斯, VLA, 世界状态token, 训练期监督, 静动分解]
    note: GaussianDream 的策略原生紧凑扩展：向 VLA 骨干插入世界状态/世界预测 token，仅训练期用世界表征头解码到共享高斯基元得到当前世界与未来预测监督，静态-动态分解聚焦交互区域；推理时移除高斯解码与 rollout 路径仅留 20 个世界 token，LIBERO 达 98.6%，真机平均成功率从 29.2% 升至 52.5% 且保持高效闭环控制。
    note_en: "A compact, policy-native extension of GaussianDream: world-state and world-prediction tokens are inserted into the VLA backbone. Only during training, world-representation heads decode shared Gaussian primitives for current-world and future-prediction supervision, with static-dynamic decomposition focusing on interaction regions. At inference, Gaussian decoding and rollout paths are removed, leaving only 20 world tokens. It reaches 98.6% on LIBERO and raises average real-robot success from 29.2% to 52.5% while maintaining efficient closed-loop control."

