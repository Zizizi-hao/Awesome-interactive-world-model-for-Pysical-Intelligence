    category: embodied
    links:
      arxiv: "2608.26239"
    features: {action: true, closedloop: true, longhorizon: true}
    tags: [长时序世界模型, 尺度自回归, 粗到细生成, 流式扩展, on-policy对齐]
    note: 把具身轨迹表示为观测-动作时序交错的因果序列，用 next-scale 粗到细自回归注入尺度对齐的动作表征，配合尺度压缩的长时记忆与 on-policy 对齐奖励，实现可变长生成、有界内存下的分钟级连贯流式 rollout 与更强动作跟随。
    note_en: "Represents embodied trajectories as causal sequences with temporally interleaved observations and actions. Next-scale, coarse-to-fine autoregression injects scale-aligned action representations, combined with scale-compressed long-term memory and an on-policy alignment reward, enabling variable-length generation, coherent minute-scale streaming rollouts with bounded memory, and stronger action following."

