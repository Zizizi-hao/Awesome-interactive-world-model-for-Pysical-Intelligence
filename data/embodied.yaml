    note: 将测试场景的探索交互压缩为物理描述 token，无需微调即可校准动作条件潜动力学；75 步上限的仿真 Push-T 中，DINO-WM 闭环成功率由 56.0% 升至 68.0%，但依赖先行交互与回合内物理恒定，尚无真机验证。
    note_en: Compresses exploratory interaction into a physics descriptor token to calibrate action-conditioned latent dynamics without fine-tuning. With a 75-step budget in simulated Push-T, DINO-WM closed-loop success rises from 56.0% to 68.0%; prior interaction and stationary episode physics are required, without real-robot validation.

