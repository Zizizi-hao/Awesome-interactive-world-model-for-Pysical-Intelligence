  - title: "4DStreamCtrl: Interactive Video Generation with Online 4D Control"
    short: 4DStreamCtrl
    org: "Yixin Zhu 团队"
    org_en: "Yixin Zhu's team"
    year: 2026
    venue: arXiv
    category: general
    links:
      arxiv: "2608.25479"
    features: {action: true, realtime: true, longhorizon: true}
    tags: [3D点轨迹, 相机-物体联合控制, 流式生成, 因果蒸馏, 可交互视频生成]
    note: 把相机运动、物体轨迹与深度统一为单一 3D 点轨迹表征，单模型一次前向即联合完成相机/物体控制、深度编辑与运动迁移；从野外视频挖掘 3D 运动监督构建 OpenVidHD-Motion3D，借时间可分离的几何运动编码器蒸馏为因果流式学生模型，4 步去噪生成任意长视频，单卡 480p 达 20 FPS 并在数百帧内保持时序一致，首次实现可交互的 4D 可控流式生成。
    note_en: "Unifies camera motion, object trajectories, and depth in a single 3D point-trajectory representation, allowing one model to jointly perform camera and object control, depth editing, and motion transfer in a single forward pass. It mines 3D motion supervision from in-the-wild videos to build OpenVidHD-Motion3D and uses a temporally separable geometric motion encoder to distill a causal streaming student model. Four denoising steps generate videos of arbitrary length, reaching 20 FPS at 480p on a single GPU while maintaining temporal consistency over hundreds of frames, enabling interactive 4D-controllable streaming generation for the first time."

