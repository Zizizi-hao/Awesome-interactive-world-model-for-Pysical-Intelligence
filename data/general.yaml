    note: 在位置–动量潜状态上学习动作条件哈密顿量，以 leapfrog 辛积分保证潜空间体积守恒。仅在视觉摆环境验证；15 TFLOPs/回合、重规划间隔 9 时，位置与速度联合目标成功率为 26%，三帧 LeWM 对照为 39%，结构保证尚未带来全面控制优势。
    note_en: Learns an action-conditioned Hamiltonian over position–momentum latents, using symplectic leapfrog integration to preserve latent phase-space volume. Validation is limited to visual pendulums. At 15 TFLOPs per episode and a replanning interval of 9, joint position-and-velocity goal success is 26%, versus 39% for a three-frame LeWM baseline; the structural guarantee does not establish uniformly better control.

