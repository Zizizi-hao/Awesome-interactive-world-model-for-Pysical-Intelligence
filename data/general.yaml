  - title: 'LeHami: Symplectic Latent Dynamics for World Models'
    short: LeHami
    org: New York University / Brown University / AMI Labs
    year: 2026
    venue: arXiv
    category: general
    links:
      arxiv: '2610.15267'
      code: https://github.com/rominay/LeHami
